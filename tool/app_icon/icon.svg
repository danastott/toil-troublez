<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon master for Toil & Troublez.
  A moonlit Enchanted Forest: three talisman cards fanned from a common pivot
  (the push-your-luck draw), a gilded crescent moon, and a double gold frame.
  Palette from lib/ui/theme.dart. Render all PNG sizes with make_icons.py.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%"  stop-color="#2F655E"/>
      <stop offset="55%" stop-color="#1B4641"/>
      <stop offset="100%" stop-color="#0A2320"/>
    </radialGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E4C766" stop-opacity="0.38"/>
      <stop offset="55%"  stop-color="#E4C766" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E4C766" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fanHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#E4C766" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#E4C766" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EDB23C"/>
      <stop offset="100%" stop-color="#9C6A10"/>
    </linearGradient>
    <linearGradient id="faceMoon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7FA8C9"/>
      <stop offset="100%" stop-color="#3D6B90"/>
    </linearGradient>
    <linearGradient id="faceStar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A06FC0"/>
      <stop offset="100%" stop-color="#5E4278"/>
    </linearGradient>
  </defs>

  <!-- Night sky -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Stars -->
  <g>
    <circle cx="118" cy="108" r="4" fill="#E4C766" opacity="0.8"/>
    <circle cx="182" cy="306" r="3" fill="#8FB8C9" opacity="0.6"/>
    <circle cx="88"  cy="470" r="3" fill="#E4C766" opacity="0.5"/>
    <circle cx="934" cy="116" r="5" fill="#E4C766" opacity="0.85"/>
    <circle cx="872" cy="262" r="3" fill="#8FB8C9" opacity="0.55"/>
    <circle cx="952" cy="428" r="3" fill="#E4C766" opacity="0.5"/>
    <circle cx="700" cy="116" r="4" fill="#8FB8C9" opacity="0.7"/>
    <circle cx="598" cy="88"  r="3" fill="#E4C766" opacity="0.6"/>
    <circle cx="372" cy="116" r="4" fill="#E4C766" opacity="0.7"/>
    <circle cx="300" cy="84"  r="3" fill="#8FB8C9" opacity="0.5"/>
    <circle cx="984" cy="224" r="3" fill="#8FB8C9" opacity="0.5"/>
    <circle cx="48"  cy="252" r="3" fill="#E4C766" opacity="0.5"/>
    <circle cx="500" cy="182" r="3" fill="#E4C766" opacity="0.55"/>
    <circle cx="760" cy="214" r="3" fill="#8FB8C9" opacity="0.5"/>
    <circle cx="140" cy="660" r="3" fill="#8FB8C9" opacity="0.45"/>
    <circle cx="884" cy="664" r="3" fill="#E4C766" opacity="0.45"/>
    <circle cx="60"  cy="560" r="3" fill="#8FB8C9" opacity="0.4"/>
    <circle cx="966" cy="566" r="3" fill="#8FB8C9" opacity="0.4"/>
  </g>

  <!-- Crescent moon -->
  <circle cx="252" cy="238" r="175" fill="url(#moonGlow)"/>
  <path fill-rule="evenodd" fill="#E4C766"
        d="M 178 238 A 74 74 0 1 1 326 238 A 74 74 0 1 1 178 238 Z
           M 224.6 230.6 A 60.7 60.7 0 1 1 346 230.6 A 60.7 60.7 0 1 1 224.6 230.6 Z"/>

  <!-- Enchanted forest: far then near silhouettes -->
  <path fill="#1F4E48" opacity="0.85" d="M 0 1024 L 0 796
    L 48 742 L 96 802 L 144 752 L 192 806 L 240 738 L 288 800 L 336 756
    L 384 804 L 432 744 L 480 802 L 528 752 L 576 806 L 624 740 L 672 800
    L 720 754 L 768 804 L 816 742 L 864 802 L 912 750 L 960 806 L 1008 744
    L 1024 760 L 1024 1024 Z"/>
  <path fill="#081D1A" d="M 0 1024 L 0 880
    L 80 812 L 160 884 L 250 820 L 340 890 L 430 816 L 520 888
    L 610 822 L 700 892 L 790 814 L 880 886 L 970 824 L 1024 872
    L 1024 1024 Z"/>

  <!-- Soft halo lifting the cards off the night -->
  <circle cx="512" cy="480" r="330" fill="url(#fanHalo)"/>

  <!-- The draw: three cards fanned about a common pivot at (512, 720).
       Each face is the card's color, bright to deep as in the app, with a
       deep-tint glyph on top and a cream talisman subject below. -->
  <g>
    <!-- Moon card (left): a raven watches. -->
    <g transform="translate(512,720) rotate(-24) translate(0,-230)">
      <rect x="-92.5" y="-131" width="185" height="262" rx="26"
            fill="url(#faceMoon)" stroke="#C9A227" stroke-width="7"/>
      <rect x="-80.5" y="-119" width="161" height="238" rx="18"
            fill="none" stroke="#C9A227" stroke-width="2.5" opacity="0.4"/>
      <g transform="translate(0,-70) scale(0.62)">
        <path fill-rule="evenodd" fill="#3D6B90" stroke="#C9A227" stroke-width="4.5"
              d="M -58 0 A 58 58 0 1 1 58 0 A 58 58 0 1 1 -58 0 Z
                 M -21.5 -5.8 A 47.6 47.6 0 1 1 73.7 -5.8 A 47.6 47.6 0 1 1 -21.5 -5.8 Z"/>
      </g>
      <g transform="translate(0,48)" fill="#F8EFDA">
        <ellipse cx="5" cy="6" rx="37" ry="27"/>
        <circle cx="-19" cy="-22" r="16"/>
        <path d="M -33 -27 L -60 -18 L -33 -9 Z" fill="#C9A227"/>
        <path d="M 30 4 L 57 24 L 28 22 Z"/>
        <circle cx="-20" cy="-24" r="3.6" fill="#3D6B90"/>
      </g>
    </g>
    <!-- Star card (right): a mushroom. -->
    <g transform="translate(512,720) rotate(24) translate(0,-230)">
      <rect x="-92.5" y="-131" width="185" height="262" rx="26"
            fill="url(#faceStar)" stroke="#C9A227" stroke-width="7"/>
      <rect x="-80.5" y="-119" width="161" height="238" rx="18"
            fill="none" stroke="#C9A227" stroke-width="2.5" opacity="0.4"/>
      <g transform="translate(0,-70) scale(0.58)">
        <path fill="#5E4278" stroke="#C9A227" stroke-width="4.5"
              d="M 0 -66 L 17.5 -24.1 L 62.8 -20.4 L 28.2 9.2 L 38.8 53.4
                 L 0 29.7 L -38.8 53.4 L -28.2 9.2 L -62.8 -20.4 L -17.5 -24.1 Z"/>
      </g>
      <g transform="translate(0,48)">
        <rect x="-15" y="-2" width="30" height="44" rx="9"
              fill="#F8EFDA" stroke="#5E4278" stroke-width="4"/>
        <path d="M -44 2 Q 0 -44 44 2 Z" fill="#F8EFDA" stroke="#5E4278" stroke-width="4"/>
        <circle cx="0" cy="-14" r="7" fill="#C9A227"/>
        <circle cx="-20" cy="-6" r="5" fill="#C9A227"/>
        <circle cx="20" cy="-6" r="5" fill="#C9A227"/>
      </g>
    </g>
    <!-- Sun card (center, on top): a toad. -->
    <g transform="translate(512,720) translate(0,-230)">
      <rect x="-92.5" y="-131" width="185" height="262" rx="26"
            fill="url(#faceSun)" stroke="#C9A227" stroke-width="7"/>
      <rect x="-80.5" y="-119" width="161" height="238" rx="18"
            fill="none" stroke="#C9A227" stroke-width="2.5" opacity="0.4"/>
      <g transform="translate(0,-70) scale(0.55)">
        <g stroke="#9C6A10" stroke-width="11" stroke-linecap="round">
          <line x1="0" y1="-48" x2="0" y2="-74"/>
          <line x1="34" y1="-34" x2="52.3" y2="-52.3"/>
          <line x1="48" y1="0" x2="74" y2="0"/>
          <line x1="34" y1="34" x2="52.3" y2="52.3"/>
          <line x1="0" y1="48" x2="0" y2="74"/>
          <line x1="-34" y1="34" x2="-52.3" y2="52.3"/>
          <line x1="-48" y1="0" x2="-74" y2="0"/>
          <line x1="-34" y1="-34" x2="-52.3" y2="-52.3"/>
        </g>
        <circle r="36" fill="#9C6A10" stroke="#C9A227" stroke-width="5"/>
      </g>
      <g transform="translate(0,48)">
        <path d="M -36 18 A 36 32 0 0 1 36 18 Z"
              fill="#F8EFDA" stroke="#9C6A10" stroke-width="4"/>
        <circle cx="-16" cy="-12" r="10" fill="#F8EFDA" stroke="#9C6A10" stroke-width="4"/>
        <circle cx="16" cy="-12" r="10" fill="#F8EFDA" stroke="#9C6A10" stroke-width="4"/>
        <circle cx="-16" cy="-12" r="4" fill="#9C6A10"/>
        <circle cx="16" cy="-12" r="4" fill="#9C6A10"/>
        <path d="M -14 8 Q 0 18 14 8" fill="none"
              stroke="#9C6A10" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Gilded double frame -->
  <rect x="30" y="30" width="964" height="964" rx="48"
        fill="none" stroke="#C9A227" stroke-width="12" opacity="0.95"/>
  <rect x="64" y="64" width="896" height="896" rx="30"
        fill="none" stroke="#C9A227" stroke-width="3" opacity="0.5"/>
</svg>
